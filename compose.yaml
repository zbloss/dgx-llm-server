services:
  vllm-server:
    image: ghcr.io/spark-arena/dgx-vllm-eugr-nightly@sha256:a8f5362e73406dd35d1f513db0f2cba050e9075bf5a1e108a9e4337df6e080d8
    restart: unless-stopped
    shm_size: "2g"
    ports:
      - "8000:8000"
    volumes:
      - /home/zbloss/models:/models:ro
      - /home/zbloss/.cache/vllm:/root/.cache/vllm
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    command: >-
      vllm serve
      --model /models/unsloth--Qwen3.8-27B-NVFP4
      --served-model-name qwen3.8-27b
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.85
      --max-model-len 262144
      --max-num-seqs 8
      --max-num-batched-tokens 8192
      --enable-chunked-prefill
      --enable-prefix-caching
      --reasoning-parser qwen3
      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
      --distributed-executor-backend mp
      --default-chat-template-kwargs '{"reasoning_effort":"medium"}'
      --kernel-config.enable_flashinfer_autotune=False
      --speculative-config '{"method":"dflash","model":"/models/z-lab--Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
