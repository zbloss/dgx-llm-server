services:
  sglang-server:
    image: lmsysorg/sglang:dev-qwen38-next-local
    restart: unless-stopped
    shm_size: "2g"
    ports:
      - "8000:8000"
    volumes:
      - /home/zbloss/models:/models:ro
      - /home/zbloss/.cache/sglang:/root/.cache/sglang
      - /home/zbloss/sglang-ple-cache:/ple-cache
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rm -rf /ple-cache/* &&
        exec sglang serve
        --model-path /models/nvidia--Qwen3.8-Flash-Next-NVFP4
        --served-model-name qwen3.8-flash-next
        --host 0.0.0.0
        --port 8000
        --tp 1
        --moe-runner-backend flashinfer_cutlass
        --fp4-gemm-backend flashinfer_cutlass
        --page-size 64
        --chunked-prefill-size 4096
        --context-length 262144
        --speculative-algorithm NEXTN
        --speculative-num-steps 3
        --speculative-eagle-topk 1
        --speculative-num-draft-tokens 4
        --max-mamba-cache-size 40
        --ple-offload-embedding
        --ple-offload-backend file
        --ple-offload-dir /ple-cache
        --mem-fraction-static 0.85
        --max-running-requests 8
        --reasoning-parser qwen3
        --tool-call-parser auto
        --enable-metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mem-watchdog:
    # ADR 0018: SGLang's DGX Spark cookbook notes that unified-memory
    # exhaustion "can take the whole box down and needs a power cycle to
    # recover" (same failure class as ADR 0012/0014's FlashInfer-autotune
    # incident). Kills sglang-server before that happens; restart:
    # unless-stopped + its own entrypoint wrapper bring it back with a
    # fresh PLE table, same as any other crash-and-recover path.
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MEM_AVAILABLE_MIN_KB=4194304
      - TARGET_CONTAINER=dgx-llm-server-sglang-server-1
      - POLL_INTERVAL_SECONDS=10
      - COOLDOWN_SECONDS=120
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do
          avail_kb=$$(awk '/MemAvailable/ {print $$2}' /host/proc/meminfo);
          if [ "$$avail_kb" -lt "$$MEM_AVAILABLE_MIN_KB" ]; then
            echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) [mem-watchdog] MemAvailable=$${avail_kb}KB below threshold=$${MEM_AVAILABLE_MIN_KB}KB - killing $$TARGET_CONTAINER";
            docker kill "$$TARGET_CONTAINER" || echo "docker kill failed (already down?)";
            sleep "$$COOLDOWN_SECONDS";
          fi;
          sleep "$$POLL_INTERVAL_SECONDS";
        done
