services:
  vllm-server:
    image: ghcr.io/spark-arena/dgx-vllm-eugr-nightly@sha256:d2eb44d303ba2888d3a029a63fbca9e33ee87e9338a8294cc3ac611b695cf76c
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /home/zbloss/models:/models:ro
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
    command: >-
      --model /models/unsloth--Qwen3.8-27B-NVFP4
      --served-model-name qwen3.8-27b
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.45
      --max-model-len 262144
      --max-num-seqs 4
      --max-num-batched-tokens 8192
      --enable-chunked-prefill
      --enable-prefix-caching
      --reasoning-parser qwen3
      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
      --distributed-executor-backend mp
      --speculative-config '{"method":"mtp","num_speculative_tokens":5}'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
