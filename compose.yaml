services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/zbloss/models:/models:ro
      - ./models/config.ini:/config.ini:ro
    command: >-
      --models-preset /config.ini
      --models-max 1
      --n-gpu-layers -1
      --host 0.0.0.0
      --port 8080
      --flash-attn on
      --jinja
      --metrics
    healthcheck:
      # GET /health does not count as an incoming task in router mode - it
      # never triggers a model load/unload. Do NOT switch this to a POST
      # /v1/chat/completions with a hardcoded model name: with two profiles
      # and --models-max 1, that would force-evict whatever model the user
      # actually has active every time the healthcheck fires (60s), which is
      # the same failure mode ADR 0003 documented for Prometheus scraping.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
