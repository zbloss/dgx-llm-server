services:
  sglang-server:
    image: lmsysorg/sglang:dev-qwen38-next-local
    restart: unless-stopped
    shm_size: "2g"
    ports:
      - "8000:8000"
    volumes:
      - /home/zbloss/models:/models:ro
      - /home/zbloss/.cache/sglang:/root/.cache/sglang
      - /home/zbloss/sglang-ple-cache:/ple-cache
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rm -rf /ple-cache/* &&
        exec sglang serve
        --model-path /models/nvidia--Qwen3.8-Flash-Next-NVFP4
        --served-model-name qwen3.8-flash-next
        --host 0.0.0.0
        --port 8000
        --tp 1
        --moe-runner-backend flashinfer_cutlass
        --fp4-gemm-backend flashinfer_cutlass
        --page-size 64
        --chunked-prefill-size 4096
        --context-length 262144
        --speculative-algorithm NEXTN
        --speculative-num-steps 3
        --speculative-eagle-topk 1
        --speculative-num-draft-tokens 4
        --max-mamba-cache-size 40
        --ple-offload-embedding
        --ple-offload-backend file
        --ple-offload-dir /ple-cache
        --mem-fraction-static 0.85
        --max-running-requests 8
        --reasoning-parser qwen3
        --tool-call-parser auto
        --enable-metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
