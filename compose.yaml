services:
  vllm-server:
    # ADR 0019: NVIDIA's FP4-Local checkpoint needs a community vLLM build
    # (b12x kernels + PLE-to-disk) that hasn't landed upstream, so this is
    # eugr/spark-vllm-b12x, not the stock vllm image. Flags and env mirror
    # the model card's DGX Spark recipe; only port, served name, and the
    # local model path are this repo's own.
    # Pinned to the digest of the build verified on 2026-10-23 (the :latest
    # tag, created 2026-10-15). Bump deliberately, not on every pull.
    image: eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595
    restart: unless-stopped
    ipc: host
    shm_size: "16g"
    ulimits:
      memlock: -1
      stack: 67108864
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    ports:
      - "8000:8000"
    volumes:
      - /home/zbloss/models:/models:ro
      - /home/zbloss/.cache/vllm:/root/.cache/vllm
      - /home/zbloss/.cache/flashinfer:/root/.cache/flashinfer
      - /home/zbloss/.triton:/root/.triton
      - /home/zbloss/.cache/b12x:/root/.cache/b12x
    environment:
      - HF_HUB_OFFLINE=1
      - VLLM_PLE_TABLE_MEMORY=disk
      - B12X_DISK_BACKEND=io_uring
      - CUTE_DSL_ARCH=sm_121a
      - SAFETENSORS_FAST_GPU=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_SSM_CONV_STATE_LAYOUT=DS
      - VLLM_USE_AOT_COMPILE=1
      - VLLM_USE_MEGA_AOT_ARTIFACT=1
      - VLLM_USE_V2_MODEL_RUNNER=1
      - B12X_POLICY_MODE=auto
      - VLLM_MXFP8_LM_HEAD=1
      - VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE=w13
      - VLLM_B12X_MOE_FP4_FORCE_A16=1
      - B12X_W4A16_A4_PREFILL=1
    entrypoint: ["bash", "-c"]
    command:
      - >-
        exec vllm serve /models/nvidia--Qwen3.8-Flash-Next-FP4-Local
        --served-model-name qwen3.8-flash-next
        --host 0.0.0.0
        --port 8000
        --tensor-parallel-size 1
        --pipeline-parallel-size 1
        --mamba-cache-mode align
        --enable-prefix-caching
        --enable-chunked-prefill
        --dtype bfloat16
        --kv-cache-dtype fp8
        --quantization modelopt_mixed
        --block-size 16
        --load-format b12x
        --max-model-len 262144
        --max-num-seqs 8
        --max-num-batched-tokens 4096
        --speculative-config '{"method":"mtp","num_speculative_tokens":4}'
        --gdn-decode-kernel b12x
        --linear-backend b12x
        --moe-backend b12x
        --no-enable-flashinfer-autotune
        --mm-encoder-tp-mode data
        --reasoning-parser qwen3
        --tool-call-parser qwen3_xml
        --enable-auto-tool-choice
        --compilation-config '{"pass_config":{"fuse_act_quant":true}}'
        --gpu-memory-utilization 0.8
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mem-watchdog:
    # ADR 0018: SGLang's DGX Spark cookbook notes that unified-memory
    # exhaustion "can take the whole box down and needs a power cycle to
    # recover" (same failure class as ADR 0012/0014's FlashInfer-autotune
    # incident). Restarts vllm-server before that happens (ADR 0019). It
    # must restart explicitly: a plain `docker kill` leaves the container
    # Exited despite restart: unless-stopped, which left the service down
    # after the 2026-10-23 trip.
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MEM_AVAILABLE_MIN_KB=4194304
      - TARGET_CONTAINER=dgx-llm-server-vllm-server-1
      - POLL_INTERVAL_SECONDS=2
      # Startup (b12x autotune) dips MemAvailable below the threshold for a
      # few seconds and recovers on its own (seen 2026-10-23: 1.8 GiB, back
      # to 42 GiB six seconds later). Only act on a sustained shortfall.
      - CONSECUTIVE_LOW_SAMPLES=3
      - COOLDOWN_SECONDS=120
    entrypoint: ["sh", "-c"]
    command:
      - >-
        low=0;
        while true; do
          avail_kb=$$(awk '/MemAvailable/ {print $$2}' /host/proc/meminfo);
          if [ "$$avail_kb" -lt "$$MEM_AVAILABLE_MIN_KB" ]; then
            low=$$((low + 1));
          else
            low=0;
          fi;
          if [ "$$low" -ge "$$CONSECUTIVE_LOW_SAMPLES" ]; then
            echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) [mem-watchdog] MemAvailable=$${avail_kb}KB below threshold=$${MEM_AVAILABLE_MIN_KB}KB for $${low} samples - restarting $$TARGET_CONTAINER";
            docker restart -t 0 "$$TARGET_CONTAINER" || echo "docker restart failed";
            low=0;
            sleep "$$COOLDOWN_SECONDS";
          fi;
          sleep "$$POLL_INTERVAL_SECONDS";
        done
