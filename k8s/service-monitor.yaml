#
# vLLM's /metrics endpoint has no ?model= requirement and no load-trigger
# behavior (that was a llama.cpp router-mode-specific bug - see ADR 0003
# and ADR 0005 for the history of why this file previously shipped with
# endpoints: [] and a scraping ban). Safe to scrape on a normal interval.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dgx-vllm
  namespace: ml
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - llm-server
  selector:
    matchLabels:
      app.kubernetes.io/name: dgx-vllm
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
