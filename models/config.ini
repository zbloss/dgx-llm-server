version = 1

# Shared across every model profile below. n-gpu-layers lives on the compose
# command line (--n-gpu-layers -1) instead of here, since command-line flags
# win over both [*] and per-model settings in llama.cpp's router precedence -
# it's the one true global for "offload everything," no need to repeat it.
[*]
threads      = 8
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse  = 256

# --- qwen3.6-35b-a3b: MoE (256 experts, 8 routed + 1 shared, 3B active) ---
# Same model already in prod under vLLM (nvidia/Qwen3.6-35B-A3B-NVFP4) -
# this is the GGUF re-encoding of it. load-on-startup is off here now that
# --models-max 2 (see compose.yaml) lets both profiles stay resident at
# once - repowise is this profile's only caller, so it can cold-load on
# repowise's first post-commit call instead of paying standing memory from
# boot. qwen3.8-27b is the one that should be warm at startup now (below).
#
# ctx-size = 524288 total, parallel = 2 -> 262144 tokens/slot. This was
# briefly raised to parallel = 4 (131072/slot) to give concurrent subagent
# runs more slots, then reverted after checking actual usage against a
# captured docker compose logs.txt: of 344 completed requests, 48.5% (167)
# already exceeded 131072 tokens, and the max seen was 191788 - parallel=4
# would have silently truncated something close to half of all real turns.
# Zero requests ever exceeded 262144, so parallel = 2 has never truncated
# anything here. --models-max 2 (see compose.yaml) already fixed the actual
# problem that prompted the parallel=4 experiment: multiple subagents used
# to fight repowise for the single resident-model slot, forcing evict/kill
# cycles (confirmed via router logs: dozens of `unload_lru` events, many
# killing a model mid-load, 38 hard 500s) - with both profiles resident
# permanently now, concurrent requests within one model just queue for a
# free slot instead of erroring, which is a much smaller cost than
# truncating real context. Re-check this token-count distribution before
# raising parallel again - don't guess a second time.
#
# spec-type = draft-mtp now works here because the model file below comes
# from unsloth/Qwen3.6-35B-A3B-MTP-GGUF, which (unlike the plain
# unsloth/Qwen3.6-35B-A3B-GGUF used previously) actually bundles MTP
# tensors - the older repo's target file lacked them, so llama-server
# failed to load with "context type MTP requested but model doesn't
# contain MTP layers" if spec-type was set against it. Verify this loads
# cleanly (check `docker compose logs` for that same load error) before
# relying on it - swap back to the plain GGUF and drop spec-type if it
# doesn't.
#
# spec-draft-n-max stays 2, spec-draft-p-min unset (tried 4/0.5, reverted):
# p-min tells the MTP draft head to stop drafting once its own confidence
# drops below a threshold, instead of guessing further and getting
# rejected - in theory this can't cause a correctness regression (spec
# decoding is always exactly verified against the full model; a bad value
# only costs speed, never output quality), so it looked safe to tune
# experimentally. It wasn't a speed win in practice: a post-deploy
# docker compose logs capture showed qwen3.6-35b-a3b decode speed at
# n-max=4/p-min=0.5 was 30.94 tokens/second (one sample, right after cold
# load) against a documented n-max=2 baseline of ~47-48 tokens/second, and
# qwen3.8-27b (see below) regressed from a documented 25-40 tokens/second
# baseline down to ~4-17 tokens/second (median ~7) across ~46 requests.
# Reverted both profiles back to n-max=2/no p-min. See ADR 0008 for the
# full before/after data - don't re-try n-max=4+/p-min without new
# evidence this hardware+model combo actually benefits from it.
[qwen3.6-35b-a3b]
model            = /models/unsloth--Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj           = /models/unsloth--Qwen3.6-35B-A3B-MTP-GGUF/mmproj-BF16.gguf
chat-template-file = /chat-templates/qwen3.6-35b-a3b.jinja
ctx-size         = 524288
parallel         = 2
spec-type        = draft-mtp
spec-draft-n-max = 2
ubatch-size      = 1024
load-on-startup  = false

# --- qwen3.8-27b: dense, native vision-language, released 2026-08-14 ---
# Same sizing logic as above. Now loaded at container startup: this is the
# model the interactive coding session talks to, so it should be the one
# that's warm and ready immediately after a restart, not qwen3.6-35b-a3b
# (repowise's model, which cold-loads lazily above).
[qwen3.8-27b]
model            = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj           = /models/unsloth--Qwen3.8-27B-GGUF/mmproj-BF16.gguf
chat-template-file = /chat-templates/qwen3.8-27b.jinja
ctx-size         = 524288
parallel         = 2
spec-type        = draft-mtp
spec-draft-n-max = 2
ubatch-size      = 1024
load-on-startup  = true
