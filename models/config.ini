version = 1

# Shared across every model profile below. n-gpu-layers lives on the compose
# command line (--n-gpu-layers -1) instead of here, since command-line flags
# win over both [*] and per-model settings in llama.cpp's router precedence -
# it's the one true global for "offload everything," no need to repeat it.
[*]
threads      = 8
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse  = 256

# --- qwen3.6-35b-a3b: MoE (256 experts, 8 routed + 1 shared, 3B active) ---
# Same model already in prod under vLLM (nvidia/Qwen3.6-35B-A3B-NVFP4) -
# this is the GGUF re-encoding of it. Loaded at container startup so the
# first coding session after a restart doesn't pay full load latency.
#
# ctx-size = 524288 total, parallel = 2 -> 262144 tokens/slot. That's the
# same 524288 total budget that was proven OOM-safe for a single MTP+mmproj
# model in the old config (c6dccd6 "fix: OOMs" dropped 1048576 -> 524288 at
# parallel=4, i.e. 131072/slot, after an actual OOM at the larger size).
# Here we spend the same proven total budget on 2 slots instead of 4, to
# land each slot's context at 262144 - matching vLLM's max-model-len instead
# of guessing a bigger number untested on this hardware+model combo.
# If devloop concurrency (multiple agent jobs sharing the GPU) mGGUFatters more
# than long single-session context, drop to parallel = 4 for 131072/slot -
# that was the historically validated devloop-concurrency tradeoff.
#
# No spec-type = draft-mtp here despite the model card's "MTP: trained with
# multi-steps" - that describes the original Qwen3.6 architecture, not this
# GGUF. unsloth's conversion doesn't export MTP layers as extra tensors (no
# separate MTP gguf in the HF repo, and the target file itself lacks them),
# so llama-server fails to load with "context type MTP requested but model
# doesn't contain MTP layers" if spec-type is set. Same applies to
# qwen3.8-27b below - re-add only if unsloth ships an MTP-bearing .
[qwen3.6-35b-a3b]
model            = /models/unsloth--Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj           = /models/unsloth--Qwen3.6-35B-A3B-GGUF/mmproj-BF16.gguf
chat-template-file = /chat-templates/qwen3.6-35b-a3b.jinja
ctx-size         = 524288
parallel         = 2
ubatch-size      = 1024
load-on-startup  = true

# --- qwen3.8-27b: dense, native vision-language, released 2026-08-14 ---
# Same sizing logic as above. Cold-loads on first request rather than at
# startup - only one "default warm" model at a time is worth the standing
# memory cost, and 35b-a3b is the one currently in production use.
[qwen3.8-27b]
model            = /models/unsloth--Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj           = /models/unsloth--Qwen3.8-27B-GGUF/mmproj-BF16.gguf
chat-template-file = /chat-templates/qwen3.8-27b.jinja
ctx-size         = 524288
parallel         = 2
spec-type        = draft-mtp
spec-draft-n-max = 2
ubatch-size      = 1024
